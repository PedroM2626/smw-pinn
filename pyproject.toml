[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smw-pinn"
version = "0.1.0"
description = "Physics-Informed Neural Networks vs Statistical Models in Super Mario World"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pedro Morato Lahoz" }]
keywords = ["physics-informed-neural-networks", "model-based-rl", "world-models", "super-mario-world", "snes"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.5.1,<2.7",
  "torchvision>=0.20.1,<0.22",
  "numpy>=1.24.0,<2.1",
  "scipy>=1.10.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "pyyaml>=6.0",
  "tqdm>=4.66.0",
  "pillow>=10.0.0",
  "imageio>=2.31.0",
  "imageio-ffmpeg>=0.4.9",
  "tensorboard>=2.15.0",
  "gplearn>=0.4.2,<0.5",
  "scikit-learn>=1.0.2,<1.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.16.0,<0.17",
  "mypy>=2.3.1,<2.4",
  "pyyaml>=6.0",
]
wandb = [
  "wandb>=0.17.0",
]
all = [
  "pytest>=7.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.16.0,<0.17",
  "mypy>=2.3.1,<2.4",
  "wandb>=0.17.0",
  "pyyaml>=6.0",
  "gplearn>=0.4.2,<0.5",
  "scikit-learn>=1.0.2,<1.6",
]

[project.urls]
Homepage = "https://github.com/PedroM2626/smw-pinn"
Repository = "https://github.com/PedroM2626/smw-pinn"
Issues = "https://github.com/PedroM2626/smw-pinn/issues"

[project.scripts]
# Cross-platform task runner (the Makefile stays canonical on Linux/macOS):
# `smw-pinn list`, `smw-pinn test-cov`, `smw-pinn reproduce`, `smw-pinn run <module>`.
smw-pinn = "src.cli:main"

[tool.setuptools.packages.find]
# src-layout: installs the top-level `src` package (imports `from src.xxx ...`).
# Canonical execution: `pip install -e .` + `python -m src.training.benchmark_experiment`
# (or the `smw-pinn` console script). The tools in scripts/ bootstrap the repo root;
# src/ never touches sys.path.
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Coverage is opt-in: `make test-cov` / CI pass --cov explicitly so plain
# `pytest` keeps working without the pytest-cov plugin installed.

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# Baseline 2026-09: 30%. Hardware/emulator/MBRL-closed-loop modules need a ROM
# + GPU and are exercised by `make reproduce`, not unit tests. Raise as
# hardware-independent coverage grows.
fail_under = 30
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
# Scientific stack ships without stubs (yaml, seaborn, ...); pragmatic default.
ignore_missing_imports = true
warn_unused_ignores = true
warn_unreachable = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
