name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    name: Lint + tests (ubuntu, py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # A single version's failure must not hide the others; the whole point of the
      # matrix is to see *which* supported Python version drifted.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          # results/MANIFEST.md freshness gate orders artifact and checkpoint commit
          # dates, which a grafted single-commit clone cannot observe.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU, editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Dependency consistency check
        run: |
          python -m pip check
          python -c "import torch, numpy; print('torch', torch.__version__, '| numpy', numpy.__version__)"
      # The static gates are version-independent, so run them once (on the pinned
      # 3.10 reference interpreter) and keep every matrix leg cheap enough to stay green.
      - name: Lint (ruff via Makefile)
        if: matrix.python-version == '3.10'
        run: make lint
      - name: Format check (ruff format via Makefile)
        if: matrix.python-version == '3.10'
        run: make format-check
      - name: Typecheck (mypy via Makefile)
        if: matrix.python-version == '3.10'
        run: make typecheck
      - name: Tests with coverage gate (via Makefile)
        run: |
          set -o pipefail
          make test-cov 2>&1 | tee pytest.log
      - name: Publish the failure tail as annotations
        if: failure()
        # Actions logs need a signed-in session; annotations do not, so the failing
        # assertions are re-emitted here for anyone reading the check.
        run: |
          if [ -f pytest.log ]; then
            grep -E '^(FAILED|ERROR) |^E  |Required test coverage|passed|failed' pytest.log \
              | tail -n 30 | sed -e 's/%/%25/g' -e 's/^/::error::/'
          fi
      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-log-ubuntu-${{ matrix.python-version }}
          path: pytest.log

  windows:
    # This project's reference hardware is Windows (that is where the Libretro core
    # loads). The Linux suite skips every emulator-dependent test, so without this job
    # no CI ever exercises the code paths on the platform the study actually runs on.
    # There is no ROM in CI, so @requires_emulator tests still skip here - but repo-root
    # path resolution, CWD-safety, subprocess-based CLI behaviour and line endings are all
    # validated natively. A self-hosted runner with a ROM dump is the follow-up that would
    # additionally re-run the published closed-loop artifacts.
    name: Native tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install (CPU, editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      # Same substantive gates as the Linux job, via the console script (make is absent
      # on Windows). Lint / typecheck / tests-with-coverage are all line-ending agnostic;
      # `ruff format --check` is intentionally NOT run here because the Windows runner
      # checks text files out with CRLF (autocrlf=true) and that gate would be noisy -
      # formatting is the Linux job's single source of truth. Emulator tests skip without
      # a committed ROM, exactly as on Linux.
      - name: Lint (ruff via console script)
        run: python -m src.cli lint
      - name: Typecheck (mypy typed core via console script)
        run: python -m src.cli typecheck
      - name: Tests with coverage gate (console script; emulator tests skip without a ROM)
        shell: bash
        run: python -m src.cli test-cov
