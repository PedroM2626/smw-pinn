name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install (CPU, editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Lint (ruff via Makefile)
        run: make lint
      - name: Typecheck (mypy via Makefile)
        run: make typecheck
      - name: Tests with coverage gate (via Makefile)
        run: make test-cov
