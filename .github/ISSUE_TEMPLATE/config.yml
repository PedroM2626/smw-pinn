# Issue-template chooser. Blank issues are disabled so every report carries the
# reproduction context (commands, environment, artifact touched) that this project needs.
blank_issues_enabled: false
contact_links:
  - name: Reproduction & usage questions
    url: https://github.com/PedroM2626/smw-pinn/discussions
    about: How do I run X / my numbers differ - ask here first (README Section 11).
  - name: Security report
    url: https://github.com/PedroM2626/smw-pinn/blob/main/SECURITY.md
    about: Please report vulnerabilities privately, never as a public issue.
