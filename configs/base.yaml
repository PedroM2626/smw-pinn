# Base defaults shared by all benchmarks. Entry points only consume the keys
# they declare as CLI flags; unknown keys here are ignored (see
# src/utils/config.py). CLI flags always override these values.
seed: 42
deterministic: true
dataset_path: "data/raw/smw_gameplay_dataset.npz"
batch_size: 128
epochs: 35
patience: 8
learning_rate: 0.001
weight_decay: 0.0001
output_dir: "results"
experiment_name: "benchmark_mlp_vs_pinn"
log_dir: "runs"

# Discrete SMW physics constants (Ricoh 5A22 fixed-point subpixels).
max_vx: 72.0
terminal_vy: 64.0
min_vy: -80.0
subpixels_per_pixel: 16.0

# Rollout evaluation.
rollout_horizon: 120
num_rollout_starts: 10
